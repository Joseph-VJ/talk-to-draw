<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Drawing Magic ✨</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://js.puter.com/v2/"></script>
</head>
<body>
    <!-- Main App -->
    <div id="app">
        <!-- Header -->
        <header>
            <h1>✨ AI Drawing Magic</h1>
            <div class="header-right">
                <button class="tab-btn" onclick="switchTab('draw')">Draw</button>
                <button class="tab-btn" onclick="switchTab('gallery')">My Gallery</button>
            </div>
        </header>

        <!-- Drawing Tab -->
        <div id="drawTab" class="tab active">
            <div class="canvas-container">
                <canvas id="drawingCanvas"></canvas>
                <div id="pencilCursor" class="pencil-cursor">✏️</div>
                <div id="statusText" class="status-text"></div>
            </div>
            
            <div class="controls">
                <div class="input-group">
                    <input type="text" id="promptInput" placeholder="Type your idea: 'draw a cute fox', 'sketch a mountain'..." />
                    <button class="mic-btn" id="micBtn" onclick="toggleVoice()" title="Click and speak (Chrome/Edge only)">
                        <span id="micIcon">🎤</span>
                    </button>
                    <button class="generate-btn" onclick="startDrawing()">Draw It!</button>
                </div>
                <div id="transcript" class="transcript"></div>
                <div class="voice-tip">💡 Tip: Click 🎤, wait for "Listening...", then speak clearly!</div>
                
                <div id="actionButtons" class="action-buttons" style="display: none;">
                    <button class="save-btn" onclick="saveDrawing()">💾 Save to Gallery</button>
                    <button class="new-btn" onclick="newDrawing()">🎨 New Drawing</button>
                </div>
            </div>
        </div>

        <!-- Gallery Tab -->
        <div id="galleryTab" class="tab">
            <div class="gallery-header">
                <h2>My Drawings</h2>
                <button onclick="loadGallery()">🔄 Refresh</button>
            </div>
            <div id="galleryGrid" class="gallery-grid">
                <!-- Gallery items loaded dynamically -->
            </div>
        </div>

        <!-- Image Modal -->
        <div id="imageModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal()">&times;</span>
                <img id="modalImage" src="" alt="Drawing">
                <div class="modal-info">
                    <p id="modalCommand"></p>
                    <p id="modalDate"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
